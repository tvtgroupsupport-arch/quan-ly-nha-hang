name: Build APK Android

# Chạy tay: tab Actions → "Build APK Android" → Run workflow. Cũng tự chạy mỗi khi đẩy code lên nhánh main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài thư viện
        run: npm install

      # Địa chỉ Supabase trung tâm được nướng vào app lúc build, lấy từ Secrets (không nằm trong mã nguồn).
      # build.mjs đọc thẳng các biến môi trường này — không ghi ra tệp.
      - name: Build giao diện (www/)
        run: npm run build
        env:
          CENTRAL_SUPABASE_URL: ${{ secrets.CENTRAL_SUPABASE_URL }}
          CENTRAL_SUPABASE_ANON_KEY: ${{ secrets.CENTRAL_SUPABASE_ANON_KEY }}
          SUPPORT_TEXT: ${{ vars.SUPPORT_TEXT }}
          GUEST_PAGE_URL: ${{ vars.GUEST_PAGE_URL }}

      # Capacitor cần thư mục www/ đã có sẵn thì mới thêm được nền tảng Android
      - name: Thêm nền tảng Android
        run: test -d android || npx cap add android

      - name: Đồng bộ vào Android và vá AndroidManifest (quyền camera, mạng)
        run: npm run sync
        env:
          CENTRAL_SUPABASE_URL: ${{ secrets.CENTRAL_SUPABASE_URL }}
          CENTRAL_SUPABASE_ANON_KEY: ${{ secrets.CENTRAL_SUPABASE_ANON_KEY }}
          SUPPORT_TEXT: ${{ vars.SUPPORT_TEXT }}
          GUEST_PAGE_URL: ${{ vars.GUEST_PAGE_URL }}

      - name: Biên dịch APK (debug — cài thẳng được lên điện thoại)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: quan-ly-nha-hang-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
